
openapi: 3.0.0
info:
  title: Simple POS API
  version: 1.0.0
paths:
  /api/v1/login:
    post:
      summary: Login dan dapatkan token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Token berhasil diterbitkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        '401':
          description: Kredensial tidak valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
  /api/v1/products:
    get:
      summary: Ambil daftar produk
      security:
        - bearerAuth: []
      parameters:
        - name: category_id
          in: query
          description: Filter berdasarkan ID kategori
          schema:
            type: integer
        - name: q
          in: query
          description: Pencarian nama produk (minimal 2 karakter)
          schema:
            type: string
            minLength: 2
        - name: sort
          in: query
          description: Pengurutan data (name, -name, price, -price)
          schema:
            type: string
            enum: [name, -name, price, -price]
        - name: per_page
          in: query
          description: Jumlah data per halaman (1 sampai 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Daftar produk berpaginasi
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        price: { type: integer }
                        category: { type: string }
                  links:
                    type: object
                    properties:
                      first: { type: string }
                      last: { type: string }
                      prev: { type: string, nullable: true }
                      next: { type: string, nullable: true }
                  meta:
                    type: object
                    properties:
                      current_page: { type: integer }
                      from: { type: integer }
                      last_page: { type: integer }
                      per_page: { type: integer }
                      to: { type: integer }
                      total: { type: integer }
        '401':
          description: Token tidak ada atau tidak valid
  /api/v1/categories:
    get:
      summary: Ambil daftar kategori
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Daftar kategori
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        products_count: { type: integer }
        '401':
          description: Token tidak ada atau tidak valid
  /api/v1/transactions:
    post:
      summary: Buat transaksi baru
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      product_id: { type: integer }
                      qty: { type: integer }
      responses:
        '201':
          description: Transaksi berhasil disimpan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      total: { type: integer }
        '401':
          description: Token tidak ada atau tidak valid
        '422':
          description: Input tidak valid, misalnya product_id tidak ditemukan
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
